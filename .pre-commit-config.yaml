# .pre-commit-config.yaml
#
# 機密情報流出を防ぐ pre-commit フック設定
# セットアップ: pip install pre-commit && pre-commit install
# 手動実行:    pre-commit run --all-files
#
# ドキュメント: https://pre-commit.com/

# -----------------------------------------------
# グローバル除外パターン
# node_modules / vendor / .git 等は全フックで無視
# -----------------------------------------------
exclude: |
  (?x)^(
    node_modules/.*|
    vendor/.*|
    \.git/.*|
    \.yarn/.*|
    dist/.*|
    build/.*|
    \.next/.*|
    __pycache__/.*|
    .*\.min\.js|
    .*\.min\.css|
    go\.sum|
    package-lock\.json|
    yarn\.lock|
    Gemfile\.lock|
    Cargo\.lock|
    poetry\.lock
  )$

repos:

  # ============================================================
  # [1] gitleaks — シークレット検知（最重要）
  #     AWS/GCP/Azure トークン、SSH 鍵、汎用 API キーなどを検知
  #     カスタムルールは .gitleaks.toml に記述
  # ============================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "gitleaks: シークレット検知"
        # プロジェクト固有ルール・除外設定は .gitleaks.toml で管理
        args: ["--config=.gitleaks.toml"]

  # ============================================================
  # [2] ローカル絶対パスの検知
  #     /Users/<name>/ や C:\Users\ がコードに含まれると
  #     環境依存・個人情報流出の原因になる
  # ============================================================
  - repo: local
    hooks:
      - id: detect-local-absolute-paths
        name: "ローカル絶対パス検知 (/Users/, /home/, C:\\Users\\)"
        language: pygrep
        # macOS: /Users/username/  Linux: /home/username/  Windows: C:\Users\
        entry: >
          (?x)(
            /Users/[A-Za-z0-9_.-]+/(?!\.)|
            /home/[A-Za-z0-9_.-]+/(?!\.)|
            [A-Za-z]:\\Users\\[A-Za-z0-9_. -]+\\|
            [A-Za-z]:\\home\\[A-Za-z0-9_. -]+\\
          )
        # テキストファイルのみ対象（バイナリ除外）
        types: [text]
        exclude: |
          (?x)^(
            .*\.md|
            .*\.txt|
            docs/.*|
            CLAUDE\.md|
            AI_CONTEXT\.md|
            README.*|
            .*\.example|
            .*\.sample|
            terminal/p10k\.zsh|
            \.gitleaks\.toml|
            \.pre-commit-config\.yaml
          )$

  # ============================================================
  # [3] .env ファイルの誤コミット防止
  #     .env, .env.local, .env.production 等を検知
  #     .env.example / .env.sample は許可
  # ============================================================
  - repo: local
    hooks:
      - id: detect-dotenv-files
        name: ".env ファイルの誤コミット検知"
        language: fail
        # .env.example や .env.sample は許可
        entry: ".env ファイルは絶対にコミットしないでください。.env.example を使用してください。"
        files: |
          (?x)^(
            \.env$|
            \.env\.[^.]+$|
            .*/\.env$|
            .*/\.env\.[^.]+$
          )$
        exclude: |
          (?x)(
            \.env\.example$|
            \.env\.sample$|
            \.env\.template$|
            \.env\.test$
          )$

  # ============================================================
  # [4] pre-commit 標準フック — 基本的なファイル品質チェック
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # ファイル末尾の空白を除去
      - id: trailing-whitespace
        name: "末尾の空白を除去"

      # ファイル末尾に改行を追加
      - id: end-of-file-fixer
        name: "ファイル末尾に改行を追加"

      # YAML 構文チェック
      - id: check-yaml
        name: "YAML 構文チェック"

      # JSON 構文チェック
      - id: check-json
        name: "JSON 構文チェック"

      # 大きなファイルのコミットを防止（デフォルト: 500KB）
      - id: check-added-large-files
        name: "大きなファイルの検知 (>500KB)"
        args: ["--maxkb=500"]

      # シークレットが含まれやすいファイル名を検知
      - id: detect-private-key
        name: "SSH 秘密鍵ファイルの検知"

      # マージコンフリクトマーカーを検知
      - id: check-merge-conflict
        name: "マージコンフリクトマーカーの検知"

      # 実行可能なシェルスクリプトの shebang チェック
      - id: check-executables-have-shebangs
        name: "シェバン行チェック"

      # case-insensitive なファイルシステムでの衝突防止
      - id: check-case-conflict
        name: "ファイル名の大文字小文字衝突チェック"

  # ============================================================
  # [5] ShellCheck — シェルスクリプト静的解析
  #     CLAUDE.md の必須ルールに準拠
  # ============================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: "ShellCheck: シェルスクリプト静的解析"
        types: [shell]
        # severity: warning 以上を失敗とする
        args: ["--severity=warning"]
        # p10k.zsh は zsh 固有構文（anonymous function 等）を含むため除外
        exclude: |
          (?x)^(
            terminal/p10k\.zsh|
            .*\.zsh$
          )$

  # ============================================================
  # [6] bin/unix ⇔ bin/windows のコマンド対応チェック
  #     全コマンドは原則両OSに実装すること（AI_CONTEXT.md の
  #     「OS 別実装の方針」参照）。片方専用のコマンドは
  #     scripts/check-bin-parity.sh 内の EXCEPTIONS で明示する。
  # ============================================================
  - repo: local
    hooks:
      - id: check-bin-parity
        name: "bin/unix ⇔ bin/windows のコマンド対応チェック"
        language: system
        entry: bash scripts/check-bin-parity.sh
        pass_filenames: false
        files: ^bin/

  # ============================================================
  # [7] .sh ⇔ .ps1 の対応チェック（bin/ を除く）
  #     Windows 向けスクリプトは PowerShell でネイティブに実装すること
  #     （AI_CONTEXT.md の「OS 別実装の方針」参照）。片方専用のファイルは
  #     scripts/check-sh-ps1-parity.sh 内の EXCEPTIONS で明示する。
  # ============================================================
  - repo: local
    hooks:
      - id: check-sh-ps1-parity
        name: ".sh ⇔ .ps1 の対応チェック"
        language: system
        entry: bash scripts/check-sh-ps1-parity.sh
        pass_filenames: false
        files: \.(sh|ps1)$

  # dotfiles-private が同じ親ディレクトリに checkout されている場合だけ、
  # 公開側の雛形・構造契約との一致を検証する。public 単独のCIでは成功扱いでskipする。
  - repo: local
    hooks:
      - id: check-private-contract
        name: "dotfiles-private 雛形・構造契約チェック"
        language: system
        entry: bash scripts/check-private-contract.sh
        pass_filenames: false
        always_run: true

  # ============================================================
  # dev-charter 憲章準拠チェック（docs/dev-charter/ に subtree 導入した
  # dev-charter lite 版が要求する自動チェック。各フックの詳細は
  # docs/dev-charter/SECURITY_POLICY.md の Configuration Files 参照）
  # ============================================================

  # [8] AI_CONTEXT.md があるのに CLAUDE.md 等がそれを参照していない
  - repo: local
    hooks:
      - id: check-ai-context-reference
        name: "dev-charter: AI_CONTEXT.md 参照チェック"
        language: system
        entry: bash scripts/check-ai-context-reference.sh
        pass_filenames: false
        always_run: true

  # [9] .github/workflows/dev-charter-check.yml が README の CI テンプレートと不一致
  - repo: local
    hooks:
      - id: check-charter-ci-template
        name: "dev-charter: CI テンプレート一致チェック"
        language: system
        entry: bash scripts/check-charter-ci-template.sh
        pass_filenames: false
        always_run: true

  # [10] docs/dev-charter/ 配下の直接編集を禁止（git subtree pull のみ許可）
  - repo: local
    hooks:
      - id: check-charter-subtree-edit
        name: "dev-charter: subtree 直接編集の禁止"
        language: system
        entry: bash scripts/check-charter-subtree-edit.sh
        pass_filenames: false
        always_run: true

  # [11] コミットメッセージが Conventional Commits 形式かチェック（commit-msg ステージ）
  #      core.hooksPath 使用時は `pre-commit install --hook-type commit-msg` が
  #      拒否されるため、このステージは個人の dotfiles 側の対応が別途必要
  #      （docs/dev-charter/SECURITY_POLICY.md の Setup Steps 参照）
  - repo: local
    hooks:
      - id: check-conventional-commit
        name: "dev-charter: Conventional Commits 形式チェック"
        language: system
        entry: bash scripts/check-conventional-commit.sh
        stages: [commit-msg]

  # [12] .env.example 等があるのに .gitignore が .env を無視していない
  - repo: local
    hooks:
      - id: check-dotenv-gitignore
        name: "dev-charter: .env/.gitignore 整合性チェック"
        language: system
        entry: bash scripts/check-dotenv-gitignore.sh
        pass_filenames: false
        always_run: true

  # [13] 日英ペアドキュメントの冒頭宣言・末尾フッターの有無をチェック
  - repo: local
    hooks:
      - id: check-language-pair-footer
        name: "dev-charter: 日英ペア見出し/フッターチェック"
        language: system
        entry: bash scripts/check-language-pair-footer.sh
        pass_filenames: false
        always_run: true

  # [14] <name>-jp.<ext> / <name>.<ext> ペアの片側のみ更新をチェック
  - repo: local
    hooks:
      - id: check-language-pair-sync
        name: "dev-charter: 日英ペア同時更新チェック"
        language: system
        entry: bash scripts/check-language-pair-sync.sh
        pass_filenames: false
        always_run: true

  # [15] LICENSE ファイルの存在チェック
  - repo: local
    hooks:
      - id: check-license-exists
        name: "dev-charter: LICENSE 存在チェック"
        language: system
        entry: bash scripts/check-license-exists.sh
        pass_filenames: false
        always_run: true

  # [16] ローカルの ../dev-charter チェックアウトとの VERSION 差分をチェック
  # dotfiles は lite 版を導入しているが、check-local-charter-version.sh は
  # デフォルトで sibling の main ブランチと比較する（dev-charter側の既知の
  # 不整合: https://github.com/y-marui/dev-charter/issues/85）。main は lite
  # より頻繁に更新されるため、デフォルトのままだと lite 側に取り込むべき
  # 実際の更新が無くても常に「古い」と誤検知してブロックされる。
  # CHARTER_LOCAL_REF=lite で比較対象を実際に導入している lite 自身に合わせる。
  - repo: local
    hooks:
      - id: check-local-charter-version
        name: "dev-charter: VERSION 追従チェック"
        language: system
        entry: env CHARTER_LOCAL_REF=lite bash scripts/check-local-charter-version.sh
        pass_filenames: false
        always_run: true

  # [17] Markdown の H2〜H6 見出しに日本語が含まれていないかチェック
  #      NOTE: 導入時点で dotfiles の大半のドキュメントは日本語見出しのため、
  #      `pre-commit run --all-files` はこのフックで広範囲に失敗する
  #      （見出しを英語化するまでの既知の状態）
  - repo: local
    hooks:
      - id: check-markdown-heading-language
        name: "dev-charter: Markdown 見出し言語チェック"
        language: system
        entry: bash scripts/check-markdown-heading-language.sh
        files: \.md$

  # [18] pyproject.toml があるのに requirements.txt が存在する、または uv.lock が無い
  - repo: local
    hooks:
      - id: check-python-package-management
        name: "dev-charter: Python パッケージ管理チェック"
        language: system
        entry: bash scripts/check-python-package-management.sh
        pass_filenames: false
        always_run: true

  # [19] LICENSE/.github/FUNDING.yml/README にプレースホルダが残っていないかチェック
  - repo: local
    hooks:
      - id: check-readme-placeholders
        name: "dev-charter: README 等プレースホルダチェック"
        language: system
        entry: bash scripts/check-readme-placeholders.sh
        pass_filenames: false
        always_run: true
