name: homebridge
services:
  homebridge:
    image: ${HOMEBRIDGE_IMAGE:?Set an official homebridge/homebridge tag or digest}
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    volumes:
      - type: bind
        source: ${HOMEBRIDGE_DATA_DIR:-/srv/homebridge}
        target: /homebridge
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8581/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
